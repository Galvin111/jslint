<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Year Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="label" id="greeting">Hello</p>
    <h1 id="date">Today</h1>

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>
    <p class="meta"><span id="percent">0%</span> of the year has passed</p>
  </main>

  <footer>Deployed with GitHub Actions</footer>

  <script src="script.js"></script>
</body>
</html>
